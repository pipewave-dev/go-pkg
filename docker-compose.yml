services:
  valkey:
    build:
      context: ./.docker/valkey
      dockerfile: Dockerfile
    ports:
      - 29100:6379
    command: valkey-server /usr/local/etc/valkey/valkey.conf
    networks:
      - pipewave

  # dynamodb-local:
  #   command: "-jar DynamoDBLocal.jar -port 29101 -sharedDb -dbPath ./data"
  #   image: "amazon/dynamodb-local:latest"
  #   ports:
  #     - "29101:29101"
  #   volumes:
  #     - ./tmp/dynamodb-data:/home/dynamodblocal/data
  #   working_dir: /home/dynamodblocal
  #   networks:
  #     - pipewave

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    ports:
      - "29102:5432"
    volumes:
      - ./tmp/postgres-data:/var/lib/postgresql/data
    networks:
      - pipewave

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "29103:4222"
      - "29104:8222"
    networks:
      - pipewave

  pipewave-server:
    build: .
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      # pipewave-server's startup reads the same -config path through two
      # different loaders that disagree on how they treat an absolute path:
      #   - server/config.Load splits filepath.Dir/Base, so it reads the
      #     literal absolute path "/etc/pipewave/config.yaml".
      #   - pipewave.ConfigFromYAML (pkg/koanf) does path.Join(".", path),
      #     which strips the leading "/" and reads relative to the
      #     process's cwd instead (WORKDIR /home/nonroot, see Dockerfile),
      #     i.e. "/home/nonroot/etc/pipewave/config.yaml".
      # Both previously resolved to the same file only because cwd was "/"
      # (no WORKDIR). Now that WORKDIR is /home/nonroot, mount the config at
      # both effective paths so each loader finds it.
      - ./server-config.example.yaml:/etc/pipewave/config.yaml:ro
      - ./server-config.example.yaml:/home/nonroot/etc/pipewave/config.yaml:ro
      - pipewave-server-data:/home/nonroot
    # NOTE: APP_-prefixed env var overrides (as documented in the README,
    # e.g. APP_SERVER__ADMIN_ADDR) do not currently take effect for nested
    # fields: pkg/koanf's env-var callback does
    # strings.TrimPrefix(key, "APP") before replacing "__" with ".", which
    # leaves a stray leading "_" (e.g. "APP_POSTGRES__HOST" -> "_POSTGRES.HOST"
    # instead of "POSTGRES.HOST"), so the override silently lands on an
    # unused key and never reaches the struct. Verified empirically while
    # wiring this service up. Until that's fixed upstream, override the
    # container-facing addresses via a second config file merged through
    # the same "-config a.yaml,b.yaml" mechanism used everywhere else
    # (server/config.Load: "later files override earlier ones").
    configs:
      - source: pipewave-docker-overrides
        target: /etc/pipewave/docker-overrides.yaml
      - source: pipewave-docker-overrides
        target: /home/nonroot/etc/pipewave/docker-overrides.yaml
    # Docker appends command after ENTRYPOINT args, so -config is passed twice; Go's flag package lets the later value win — intentional, do not simplify.
    command: ["-config", "/etc/pipewave/config.yaml,/etc/pipewave/docker-overrides.yaml"]
    depends_on:
      - valkey
      - postgres
      - nats
    networks:
      - pipewave

networks:
  pipewave:
    driver: bridge

volumes:
  pipewave-server-data:

configs:
  pipewave-docker-overrides:
    content: |
      VALKEY:
        PRIMARY_ADDRESS: "valkey:6379"
        REPLICA_ADDRESS: "valkey:6379"
      POSTGRES:
        HOST: "postgres"
        PORT: 5432
      SERVER:
        CALLBACKS:
          # On native Linux Docker Engine, use extra_hosts: ["host.docker.internal:host-gateway"] (works out of the box on Docker Desktop)
          BASE_URL: "http://host.docker.internal:9000/pipewave/callback"
          TRANSPORT: "pubsub"
          PUBSUB:
            URL: "nats://nats:4222"
