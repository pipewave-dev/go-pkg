ENV_NAME: "development"
POD_NAME: "pipewave-pod-1"
VERSION: "1.0.0"

AUTO_MIGRATION: true

DEBUG:
  ENABLED: true

WORKER_POOL:
  # WORKERS: 0 (or omitted) derives the worker count from GOMAXPROCS, which
  # respects the container CPU limit. Set it only to override that.
  # WORKERS: 0
  #
  # BUFFER is the task queue depth. When it fills, tasks are dropped and the
  # websocket layer has to re-arm and retry the read, so size it for peak
  # concurrent inbound frames rather than average load. UPPER/LOWER_THRESHOLD
  # default to 3/4 and 1/4 of BUFFER; crossing the upper mark reports the
  # container unhealthy so the load balancer stops sending it new connections.
  BUFFER: 4096
  UPPER_THRESHOLD: 3072
  LOWER_THRESHOLD: 1024

ACTIVE_CONNECTION:
  # MAX_CONNECTIONS caps concurrent websocket connections per container.
  # 0 disables the cap.
  #
  # Each connection costs at least one file descriptor, so keep this below the
  # process RLIMIT_NOFILE (logged at startup by pkg/runtimetune) with headroom
  # for the database, cache and HTTP client pools. Rejecting past a known-safe
  # ceiling gives clients a retryable error instead of letting fd exhaustion
  # degrade the whole process. Tune from load-test results — the safe value
  # depends on frame size and message rate.
  MAX_CONNECTIONS: 0

# IETF language tag. See: https://en.wikipedia.org/wiki/IETF_language_tag#List_of_common_primary_language_subtags
DEFAULT_LANG: "en"

# Timezone name. See: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
TIME_ZONE: "Asia/Tokyo"

TRACE_ID_HEADER: "X-Trace-Id"
IP_HEADER: "X-Real-Ip"

CORS:
  ENABLED: true
  EXACTLY_ORIGINS: []
    # - http://localhost:3100
  REGEX_ORIGINS:
    - ws://localhost:([0-9]+)
    - wss://localhost:([0-9]+)
    - http://localhost:([0-9]+)
    - https://localhost:([0-9]+)

RATE_LIMITER:
  USER_RATE: 100
  USER_BURST: 200
  ANONYMOUS_RATE: 10
  ANONYMOUS_BURST: 20
  ISSUE_TOKEN_IP_RATE: 5
  ISSUE_TOKEN_IP_BURST: 20

# HMAC secret used to sign server-issued anonymous InstanceIDs. Required —
# must be shared and stable across all replicas. Generate with e.g.
# `openssl rand -base64 32` and set via env var in non-dev environments.
ANONYMOUS_INSTANCE:
  SECRET: "dev-only-anonymous-instance-secret-change-me"

OTEL:
  ENABLED: false
  AUTO_INSTRUMENTATION: false
  # One of: discard, stdout, file, otlp-grpc, otlp-http
  EXPORTER_TYPE: "discard"
  # Required when EXPORTER_TYPE is "file"
  FILE_PATH: ""
  # Required when EXPORTER_TYPE is "otlp-grpc" or "otlp-http"
  COLLECTOR_ENDPOINT: ""
  COLLECTOR_INSECURE: false

VALKEY:
  PRIMARY_ADDRESS: "localhost:29100"
  REPLICA_ADDRESS: "localhost:29100"
  PASSWORD: veryStrongP@ssw0rd
  DB_INDEX: 0

DYNAMODB:
  CREATE_TABLES: true
  REGION: "ap-northeast-1"
  ENDPOINT: http://localhost:29101
  # ROLE: null
  # PROFILE: null
  # STATIC_ACCESS_KEY: null
  # STATIC_SECRET_KEY: null

DYNAMO_TABLES:
  ACTIVE_CONNECTION: "active_connection_dev"
  FCM_DEVICE: "fcm_device_dev"
  GROUP: "group_dev"
  USER: "user_dev"
  USER_GROUP: "user_group_dev"
  NOTI_CONTENT: "noti_content_dev"
  G_NOTI: "g_noti_dev"
  U_NOTI: "u_noti_dev"
  NOTI_TIME_BUCKET: "noti_time_bucket_dev"

POSTGRES:
  CREATE_TABLES: true
  HOST: localhost
  PORT: 29102
  DB_NAME: postgres
  USER: postgres
  PASSWORD: postgres
  SSL_MODE: disable
  MAX_CONNS: 15
  MIN_CONNS: 1
