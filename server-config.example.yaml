# server-config.example.yaml — config for the pipewave-server container.
# Core sections (VALKEY, POSTGRES, WORKER_POOL, ...) are the same as
# example-config.yaml; SERVER is the container-only section.

# INFO.ENV is required — EnvType.Validate() panics with
# "info env must not be empty" if it's blank. CONTAINER_ID is intentionally
# omitted: InfoT.loadDefault() auto-generates one when empty.
INFO:
  ENV: "development" # required, e.g. development | staging | production
  POD_NAME: "pipewave-server-dev" # optional, informational only

AUTO_MIGRATION: true

# ANONYMOUS_INSTANCE.SECRET is required — AnonymousInstanceT.validate() panics
# ("anonymous instance secret must be set") if it's blank. It's the HMAC
# secret used to sign/verify server-issued anonymous InstanceIDs and must be
# shared/stable across all replicas.
ANONYMOUS_INSTANCE:
  SECRET: "dev-anonymous-instance-secret-change-me"

# Server-driven liveness detection. Both keys are optional; the values below
# are the defaults applied by PingCheckerT.loadDefault().
PING_CHECKER:
  PING_IDLE_AFTER: "20s" # send a ping after a connection has been idle this long
  PONG_TIMEOUT: "3s" # close the connection if no pong arrives within this window

WORKER_POOL:
  # Omit WORKERS to size the pool from GOMAXPROCS (respects the container CPU
  # limit). BUFFER is the task queue depth; when it fills tasks are dropped and
  # reads are retried, so size it for peak concurrent inbound frames.
  BUFFER: 4096
  UPPER_THRESHOLD: 3072
  LOWER_THRESHOLD: 1024

ACTIVE_CONNECTION:
  # Cap on concurrent websocket connections per container; 0 disables it.
  # Keep below RLIMIT_NOFILE (logged at startup) with headroom for DB/cache
  # pools, and tune from load-test results.
  MAX_CONNECTIONS: 0

VALKEY:
  PRIMARY_ADDRESS: "localhost:29100"
  REPLICA_ADDRESS: "localhost:29100"
  PASSWORD: "veryStrongP@ssw0rd"
  DB_INDEX: 0 # was DATABASE_IDX — not a real koanf tag on ValkeyT, silently ignored

POSTGRES:
  CREATE_TABLES: true
  HOST: "localhost"
  PORT: 29102
  DB_NAME: "postgres"
  USER: "postgres"
  PASSWORD: "postgres"
  SSL_MODE: "disable"
  MAX_CONNS: 15
  MIN_CONNS: 1

SERVER:
  CLIENT_ADDR: ":8080"
  ADMIN_ADDR: ":8081"
  # Env-var overrides (e.g. APP_SERVER__ADMIN_ADDR) are currently
  # non-functional (known pkg/koanf bug). Use additional YAML override files
  # passed via the comma-separated -config flag instead.
  API_KEYS: ["change-me-123"]
  REPOSITORY: "postgres" # postgres | dynamodb
  AUTH:
    MODE: "webhook" # webhook | jwt
    JWT:
      JWKS_URL: ""
      PUBLIC_KEY_PEM_FILE: ""
      USER_ID_CLAIM: "sub"
      METADATA_CLAIMS: []
  CALLBACKS:
    BASE_URL: "http://localhost:9000/pipewave/callback"
    SIGNATURE:
      MODE: "enabled" # enabled | disabled — disabled bỏ ký khi callback nội bộ / đã có mTLS
      SIGNING_KEY_FILE: "webhook_ed25519.key"
    HANDLE_MESSAGE:
      MODE: "sync" # sync | forward | disabled
      TIMEOUT: "5s"
    SYNC_TIMEOUT: "3s"
    ASYNC_RETRY_MAX: 6
    # ASYNC_BACKOFF: ["1s", "5s", "30s", "2m", "10m"] # default when unset; last value repeats
    SYNC_RETRY:
      MAX: 1 # 1 = no retry (client is waiting); retries only transport errors/5xx, never 4xx
      BACKOFF: "100ms"
    BREAKER:
      THRESHOLD: 5 # consecutive transport/5xx failures before the circuit opens
      COOLDOWN: "10s"
    PING:
      ENABLED: false # boot-check + runtime ticker; disabled = no active health probing
      PATH: "/pipewave/ping"
      INTERVAL: "30s"
      TIMEOUT: "3s"
      FAIL_THRESHOLD: 3
    UNHEALTHY_ACTION: "log-only" # log-only | shutdown — what to do when backend is marked unhealthy
    BREAKER_OPEN_SHUTDOWN: "0s" # e.g. "60s" to also mark unhealthy when breaker stays open that long; 0 = disabled
    # Transport cho Class-2 (async) events: webhook | pubsub. Mặc định webhook.
    # Class-1 (inspect_token, handle_message, on_new_connection) LUÔN dùng
    # webhook vì cần response — vì vậy BASE_URL vẫn bắt buộc ở mọi transport.
    TRANSPORT: "webhook"
    # PUBSUB:
    #   DRIVER: "natsjs"
    #   URL: "nats://localhost:4222"
    #   STREAM: "PIPEWAVE_EVENTS"
    #   SUBJECT_PREFIX: "pipewave.events"

# Prometheus metrics. Served on a dedicated listener so Prometheus can scrape
# without being granted admin API access.
METRICS:
  ENABLED: false
  PORT: 9090
  PATH: "/metrics"
  # App-level msg_type values that get their own metric label. Anything not
  # listed is reported as "other" — msg_type is client-controlled, so this
  # list is what bounds label cardinality. Max 32 printable ASCII chars each.
  MSG_TYPE_ALLOWLIST: []
